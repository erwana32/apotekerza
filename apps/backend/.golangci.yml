              desc: "Call another module only through its public module.go package (docs/architecture.md)"
        finance:
          files: ["**/internal/finance/**"]
          list-mode: lax
          allow:
            - github.com/erwana32/apotekerza/internal/finance$
            - github.com/erwana32/apotekerza/internal/finance/
            - github.com/erwana32/apotekerza/internal/platform/
            - github.com/erwana32/apotekerza/internal/identity$
            - github.com/erwana32/apotekerza/internal/masterdata$
            - github.com/erwana32/apotekerza/internal/inventory$
            - github.com/erwana32/apotekerza/internal/purchase$
