version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/store/queries
    gen:
      go:
        package: gen
        out: internal/identity/store/gen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: timestamptz
            go_type: time.Time